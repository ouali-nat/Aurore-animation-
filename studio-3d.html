<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier 3D — Aurore Animation</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4efe8;color:#1a1210;display:flex;flex-direction:column;height:100vh}
#cv{flex:1;width:100%;min-height:0;touch-action:none;cursor:grab}
.bar{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;align-items:center}
button,select{flex:none;padding:8px 12px;border:0;border-radius:8px;background:#1a1210;color:#fff;font-size:14px}
button.on{background:#e0a82e;color:#1a1210}
#msg{padding:6px 10px;font-size:13px}
</style></head><body>
<div class="bar"><select id="an"></select><button id="png">PNG</button></div>
<canvas id="cv"></canvas>
<div class="bar" id="names"></div>
<div id="msg" role="status" aria-live="polite">Chargement du moteur 3D et des personnages…</div>
<script>window.addEventListener("error",function(e){if(e.target&&e.target.tagName==="SCRIPT"){document.querySelector("#msg").textContent="Impossible de charger un script : "+(e.target.src||"script intégré")+". Vérifie la connexion Internet puis recharge la page.";return;}if(e.message){document.querySelector("#msg").textContent="Erreur du moteur 3D : "+e.message;}},true);</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="characters-2d.js"></script>
<script src="characters-3d.js"></script>
<script>
const L=window.CHARACTERS_2D,$=s=>document.querySelector(s),cv=$('#cv');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,50);
sc.add(new THREE.HemisphereLight(0xffffff,0x887766,.9));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(2,4,3);sc.add(dl);
let cur=null,ry=.4,dist=6.2,drag=null;
$('#an').innerHTML=['idle','walk','run','wave','dance','talk','jump','pose'].map(a=>`<option>${a}</option>`).join('');
$('#an').onchange=()=>{if(cur)cur.anim=$('#an').value};
$('#names').innerHTML=L.map((c,i)=>`<button data-i="${i}">${c.name}</button>`).join('');
function pick(i){if(cur)sc.remove(cur.root);cur=buildCharacter3D(L[i]);cur.anim=$('#an').value;sc.add(cur.root);
 document.querySelectorAll('#names button').forEach((b,j)=>b.classList.toggle('on',j==i))}
$('#names').onclick=e=>{if(e.target.dataset.i)pick(+e.target.dataset.i)};
cv.onpointerdown=e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(drag!=null){ry+=(e.clientX-drag)*.01;drag=e.clientX}};
cv.onpointerup=()=>drag=null;
cv.onwheel=e=>{e.preventDefault();dist=Math.min(12,Math.max(2.5,dist+e.deltaY*.005))};
$('#png').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=(cur?cur.c.id:'perso')+'.png';a.click()};
function loop(now){
 const w=cv.clientWidth,h=cv.clientHeight;
 if(cv.width!=w||cv.height!=h){ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
 if(cur){poseCharacter3D(cur,now/1000);cur.root.rotation.y=ry+(cur.pivot||0)}
 cam.position.set(0,1.3,dist);cam.lookAt(0,1.05,0);
 ren.render(sc,cam);requestAnimationFrame(loop)}
try { pick(0); $('#msg').textContent = L.length + ' personnages 3D chargés. Glisse pour tourner, molette pour zoomer.'; } catch (err) { $('#msg').textContent = 'Impossible de créer le personnage 3D : ' + err.message; }
requestAnimationFrame(loop);
</script></body></html>
