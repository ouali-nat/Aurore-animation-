<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier 2D — Aurore Animation</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4efe8;color:#1a1210}
header{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0 auto 0 0}
button{padding:8px 12px;border:0;border-radius:8px;background:#1a1210;color:#fff;font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;padding:6px;text-align:center;font-size:13px;cursor:pointer}
.card svg{width:100%;height:auto}
#ed{display:none;position:fixed;inset:0;background:#f4efe8;overflow:auto;padding:12px}
#big svg{width:min(260px,70vw);height:auto;display:block;margin:0 auto}
textarea{width:100%;height:150px;font:12px monospace;box-sizing:border-box}
.bob{animation:bob 2.4s ease-in-out infinite}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes sway{50%{transform:rotate(1.5deg)}}
</style></head><body>
<header><h1>Atelier 2D — 20 personnages</h1><button id="all">Enregistrer le JSON</button></header>
<div id="grid"></div>
<section id="ed"><div id="big"></div><textarea id="js"></textarea>
<p><button id="ap">Appliquer</button> <button id="dl">Télécharger SVG</button> <button id="cl">Fermer</button></p></section>
<script src="characters-2d.js"></script>
<script>
const L=window.CHARACTERS_2D,$=s=>document.querySelector(s);let cur=0;
function render(){$('#grid').innerHTML=L.map((c,i)=>`<div class="card" data-i="${i}">${drawCharacter(c)}<b>${c.name}</b></div>`).join('')}
function save(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
$('#grid').onclick=e=>{const k=e.target.closest('.card');if(!k)return;cur=+k.dataset.i;open_()};
function open_(){$('#ed').style.display='block';$('#big').innerHTML=drawCharacter(L[cur],260);$('#js').value=JSON.stringify(L[cur],null,2)}
$('#ap').onclick=()=>{try{L[cur]=JSON.parse($('#js').value);render();open_()}catch(e){alert('JSON invalide')}};
$('#cl').onclick=()=>$('#ed').style.display='none';
$('#dl').onclick=()=>save(L[cur].id+'.svg',drawCharacter(L[cur],512),'image/svg+xml');
$('#all').onclick=()=>save('characters-2d.json',JSON.stringify({version:3,characters:L},null,2),'application/json');
render();
</script></body></html>
