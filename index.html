<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurore Animation</title>
<style>
:root{--bg:#07100c;--fg:#d8fbe8;--ac:#2de08f;--card:#0e1d16}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:12px;max-width:960px;margin:auto}
h1{font-size:20px;margin:4px 0 10px;color:var(--ac)}
canvas{width:100%;height:auto;background:#000;border:1px solid #1d3a2c;border-radius:10px;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
button,label.b{background:var(--ac);color:#04140c;border:0;border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer}
button.s,label.b.s{background:var(--card);color:var(--fg);border:1px solid #1d3a2c}
input[type=file]{display:none}
textarea{width:100%;height:280px;background:var(--card);color:var(--fg);border:1px solid #1d3a2c;border-radius:8px;padding:8px;font:12px/1.3 monospace}
#msg{font-size:13px;opacity:.8}
#gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
#gal div{background:#000;border:1px solid #1d3a2c;border-radius:6px;text-align:center;font-size:11px;padding:3px}
#gal img{max-width:100%;max-height:52px}
video{width:100%;margin-top:8px;border-radius:10px}
a#dl{color:var(--ac)}
h2{font-size:15px;margin:16px 0 6px}
</style>
</head>
<body>
<h1>Aurore Animation</h1>
<canvas id="cv" width="960" height="540"></canvas>
<div class="row">
<button id="play">Pause</button>
<button id="replay" class="s">Rejouer</button>
<button id="rec">Exporter la vidéo</button>
<label class="b s">Planche<input id="file" type="file" accept="image/*"></label>
<span id="tm">0.0 s</span>
</div>
<div id="msg">Chargement…</div>
<video id="out" controls hidden></video>
<div class="row"><a id="dl" hidden>Télécharger la vidéo</a></div>
<h2>Scène (JSON)</h2>
<textarea id="json" spellcheck="false"></textarea>
<div class="row"><button id="apply">Appliquer</button></div>
<h2>Personnages détectés (numéro = champ "sprite")</h2>
<div id="gal"></div>
<script src="app.js"></script>
<script src="world.js"></script>
</body>
</html>
